[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regress"
version = "0.3.0"
description = "Regression testing for self-evolving agents: detect memory collapse after each learning cycle."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]
space = ["gradio>=4.44", "uvicorn>=0.23"]
llm = ["llama-cpp-python>=0.3"]
claude = ["anthropic>=0.70"]

[project.scripts]
regress = "regress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
regress = ["assets/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9", "B", "I"]
ignore = ["B905"]
